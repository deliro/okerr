---
on:
  release:
    types: [published]

name: Publish to PyPI

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build packages
        run: uv build

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import corrode; assert corrode.Ok(1).unwrap() == 1"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
