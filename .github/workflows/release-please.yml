---
on:
  push:
    branches:
      - main

name: Release Please

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: python

      - uses: actions/checkout@v7
        if: steps.release.outputs.pr
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - uses: astral-sh/setup-uv@v7
        if: steps.release.outputs.pr

      - name: Update uv.lock
        if: steps.release.outputs.pr
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            echo "uv.lock is already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: update uv.lock"
            git push
          fi

  # The release above is created with GITHUB_TOKEN, and GitHub does not start
  # workflows from events raised by that token — so `on: release: published`
  # never fires. Publishing and the release docs are chained explicitly instead.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml

  docs:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
